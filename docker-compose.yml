version: "3.8"

services:
  backend:
    build:
      context: ./Backend/Github        # pom.xml lives here, not in ./Backend
      dockerfile: Dockerfile.dev        # Dockerfile.dev must live in Backend/Github/, not Backend/
    container_name: gha-backend
    restart: unless-stopped
    environment:
      GITHUB_TOKEN: ${GITHUB_TOKEN}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      OLLAMA_URL: http://host.docker.internal:11434/api/generate
      OLLAMA_MODEL: llama3.2
    ports:
      - "8080:8080"
    volumes:
      - ./Backend/Github:/app
      - backend_m2:/root/.m2

  frontend:
    build:
      context: ./Frontend
      dockerfile: Dockerfile.dev
    container_name: gha-frontend
    restart: unless-stopped
    depends_on:
      - backend
    environment:
      VITE_API_BASE_URL: http://localhost:8080
    ports:
      - "5173:5173"
    volumes:
      - ./Frontend:/app
      - /app/node_modules

volumes:
  backend_m2: